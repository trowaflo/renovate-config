name: Validate Renovate Config

on:
  pull_request:
    paths: ['*.json', '*.json5']
  workflow_dispatch:

permissions: read-all

jobs:
  validate:
    uses: trowaflo/github-actions/.github/workflows/lint-renovate.yml@3f2cc0504b841ef8f0b1dfcc4edd273309eebd27 # v5.1.1
    with:
      # Sans cet input, le workflow appelé cherche `find . -maxdepth 1 -name '*renovate*'`,
      # donc uniquement `renovate.json5` ici. Les huit presets que ce dépôt publie à
      # trente dépôts ne seraient jamais validés. Le glob couvre aussi tout preset ajouté.
      config_files: "*.json *.json5"
