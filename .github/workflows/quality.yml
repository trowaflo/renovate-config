name: Quality

on:
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  lint:
    uses: trowaflo/github-actions/.github/workflows/lint.yml@3f2cc0504b841ef8f0b1dfcc4edd273309eebd27 # v5.1.1
    permissions:
      contents: read
      security-events: write
      pull-requests: write   # required by nested shellcheck/shfmt jobs (reviewdog inline comments), even when disabled
    with:
      enable_actionlint: true
      enable_markdown_lint: true
      # Off: it parses every *.json as strict JSON, while Renovate reads
      # default.json as JSONC and its x-release-please-version comments are
      # required. renovate-config-validator --strict (validate.yml) parses and
      # checks every preset; the other JSON files fail their own tool if broken.
      enable_json_lint: false

  security:
    uses: trowaflo/github-actions/.github/workflows/security.yml@3f2cc0504b841ef8f0b1dfcc4edd273309eebd27 # v5.1.1
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    with:
      enable_gitleaks: true
      enable_checkov: true
      enable_kics: true
      enable_trivy: true
