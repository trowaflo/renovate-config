name: Quality

on:
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  lint:
    uses: trowaflo/github-actions/.github/workflows/lint.yml@745d89e5792c3f9dd0c62e33a1065afd2eadc7a7 # v3.0.0
    permissions:
      contents: read
      security-events: write
      pull-requests: write   # required by nested shellcheck/shfmt jobs (reviewdog inline comments), even when disabled
    with:
      enable_actionlint: true
      enable_markdown_lint: true
      enable_json_lint: true

  security:
    uses: trowaflo/github-actions/.github/workflows/security.yml@745d89e5792c3f9dd0c62e33a1065afd2eadc7a7 # v3.0.0
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    with:
      enable_gitleaks: true
      enable_checkov: true
      enable_kics: true
      enable_trivy: true
