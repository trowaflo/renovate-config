name: Test

on:
  pull_request:
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regex:
    name: Regex fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # package.json lives in test/: at the root, *.json would read it as a preset.
      - name: Install
        working-directory: test
        run: npm ci --ignore-scripts

      - name: Test
        working-directory: test
        run: npm test
