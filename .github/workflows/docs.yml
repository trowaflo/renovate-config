name: Documentation

# README.md is generated by scripts/readme.py and committed in the PR. The
# workflow only checks it is current: a bot push to the PR branch would leave
# the head commit without checks, and main only accepts PRs.

on:
  pull_request:
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readme:
    name: README is current
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Regenerate README.md
        run: python3 scripts/readme.py

      - name: Fail if README.md changed
        run: |
          git diff --exit-code README.md || {
            echo "::error file=README.md::README.md is stale: run python3 scripts/readme.py and commit."
            exit 1
          }
